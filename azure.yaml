# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: stlc-agents
services:
    proj-default:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    test-executor:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - proj-default
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: src/test_executor.py
            runtime: python_3_14
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: ${FOUNDRY_PROJECT_ENDPOINT}
            - name: AZURE_KEY_VAULT_URL
              value: ${AZURE_KEY_VAULT_URL}
            - name: GITHUB_PAT_SECRET_NAME
              value: ${GITHUB_PAT_SECRET_NAME}
            - name: GITHUB_OWNER
              value: ${GITHUB_OWNER}
            - name: GITHUB_REPO
              value: ${GITHUB_REPO}
            - name: GITHUB_MCP_URL
              value: ${GITHUB_MCP_URL}
            - name: GITHUB_MCP_ALLOWED_TOOLS
              value: ${GITHUB_MCP_ALLOWED_TOOLS}
        kind: hosted
        name: test-executor
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python src/test_executor.py
infra:
    provider: microsoft.foundry
